<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Chess: Boards &amp; Puzzles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)" />
  <rect x="0" y="0" width="10" height="400" fill="#f59e0b" />

  <!-- A corner of a board, with a knight's move drawn across it -->
  <g transform="translate(150 140)">
    <rect x="-72" y="-72" width="144" height="144" fill="#d6d3d1" />
    <g fill="#57534e">
      <rect x="-72" y="-36" width="36" height="36" />
      <rect x="-72" y="36" width="36" height="36" />
      <rect x="-36" y="-72" width="36" height="36" />
      <rect x="-36" y="0" width="36" height="36" />
      <rect x="0" y="-36" width="36" height="36" />
      <rect x="0" y="36" width="36" height="36" />
      <rect x="36" y="-72" width="36" height="36" />
      <rect x="36" y="0" width="36" height="36" />
    </g>
    <rect x="-72" y="-72" width="144" height="144" fill="none" stroke="#1c1917" stroke-width="3" />

    <path
      d="M-18 54 L-18 -18 L18 -18"
      fill="none"
      stroke="#fbbf24"
      stroke-width="3"
      stroke-dasharray="7 5"
      stroke-linecap="round"
    />
    <circle cx="-18" cy="54" r="7" fill="#fbbf24" />
    <circle cx="18" cy="-18" r="10" fill="none" stroke="#fbbf24" stroke-width="3" />
  </g>

  <text
    x="28"
    y="288"
    fill="#ffffff"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="bold"
  >
    Chess:
  </text>
  <text
    x="28"
    y="322"
    fill="#ffffff"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="26"
    font-weight="bold"
  >
    Boards &amp; Puzzles
  </text>
  <text x="28" y="356" fill="#fcd34d" font-family="Georgia, 'Times New Roman', serif" font-size="15">
    Replay a game, then find the move
  </text>
</svg>
