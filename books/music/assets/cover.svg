<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="How Music Is Written Down">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b2f63" />
      <stop offset="100%" stop-color="#170f2b" />
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bg)" />
  <rect x="0" y="0" width="10" height="400" fill="#a78bfa" />

  <!-- Five lines, and notes climbing them -->
  <g stroke="#c4b5fd" stroke-width="2">
    <line x1="40" y1="120" x2="270" y2="120" />
    <line x1="40" y1="140" x2="270" y2="140" />
    <line x1="40" y1="160" x2="270" y2="160" />
    <line x1="40" y1="180" x2="270" y2="180" />
    <line x1="40" y1="200" x2="270" y2="200" />
  </g>
  <g fill="#fbbf24">
    <ellipse cx="80" cy="200" rx="9" ry="6.5" transform="rotate(-20 80 200)" />
    <ellipse cx="130" cy="180" rx="9" ry="6.5" transform="rotate(-20 130 180)" />
    <ellipse cx="180" cy="160" rx="9" ry="6.5" transform="rotate(-20 180 160)" />
    <ellipse cx="230" cy="140" rx="9" ry="6.5" transform="rotate(-20 230 140)" />
  </g>
  <g stroke="#fbbf24" stroke-width="2">
    <line x1="88" y1="198" x2="88" y2="158" />
    <line x1="138" y1="178" x2="138" y2="138" />
    <line x1="188" y1="158" x2="188" y2="118" />
    <line x1="238" y1="138" x2="238" y2="98" />
  </g>

  <text
    x="28"
    y="285"
    fill="#ffffff"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="27"
    font-weight="bold"
  >
    How Music
  </text>
  <text
    x="28"
    y="318"
    fill="#ffffff"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="27"
    font-weight="bold"
  >
    Is Written Down
  </text>
  <text x="28" y="352" fill="#c4b5fd" font-family="Georgia, 'Times New Roman', serif" font-size="15">
    Reading a stave, from scratch
  </text>
</svg>
